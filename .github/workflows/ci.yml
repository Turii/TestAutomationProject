name: My CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Install Android SDK and Emulator
        run: |           
          sudo apt-get update           
          sudo apt-get install -y openjdk-17-jdk wget unzip curl           
          mkdir -p $HOME/Library/Android/sdk           
          cd $HOME/Library/Android/sdk           
          wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip -O cmdline-tools.zip           
          unzip cmdline-tools.zip -d cmdline-tools           
          mkdir cmdline-tools/latest           
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ 
          
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:\$PATH" >> $GITHUB_ENV
          
          $HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "emulator" "system-images;android-30;google_apis;x86_64"
          yes | $HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: List files in Android SDK
        run: |
          ls -R $HOME/Library/Android/sdk/cmdline-tools/latest/bin

      - name: Test sdkmanager command
        run: |
          $HOME/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager --list

      - name: Start Android Emulator
        env:
          ADB_INSTALL_TIMEOUT: 10
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --force
          $ANDROID_HOME/emulator/emulator -avd test -no-snapshot-save -no-window -noaudio -gpu swiftshader_indirect &

      - name: Wait for Android Emulator to boot
        run: |
          adb wait-for-device
          adb shell input keyevent 82

      - name: Install Appium
        run: |
          npm install -g appium
          appium -v # Check Appium version

      - name: Start Appium Server
        run: appium &

      - name: Install Chrome
        run: sudo apt-get install google-chrome-stable

      - name: Build with Maven
        env:
          S_USERNAME: ${{secrets.S_USERNAME}}
          S_PASSWORD: ${{secrets.S_PASSWORD}}
          BASE_URL: ${{secrets.BASE_URL}}
          CI_RUN: true
        run: mvn -B package --file pom.xml

      - name: Run all Tests (TestNG and JUnit)
        run: mvn test

      - name: Display Test Results
        run: cat target/surefire-reports/*.txt

      - name: Attach screenshots and reports
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: screenshots-and-report
          path: |
            screenshots
            target/surefire-reports/emailable-report.html

      - name: Attach reports only
        uses: actions/upload-artifact@v3
        with:
          name: report
          path: target/surefire-reports/emailable-report.html